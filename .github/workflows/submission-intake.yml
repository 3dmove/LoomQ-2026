name: LoomQ final submission intake

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: submission-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted intake code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate issue and download immutable commit archive
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 competition/submission_intake.py validate
          --event "$GITHUB_EVENT_PATH"
          --archive "$RUNNER_TEMP/loomq-submission.tar.gz"
          --metadata "$RUNNER_TEMP/loomq-submission.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Archive accepted submission
        if: steps.validate.outputs.eligible == 'true'
        id: archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.validate.outputs.artifact_name }}
          path: ${{ runner.temp }}/loomq-submission.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ fromJSON(steps.validate.outputs.retention_days) }}

      - name: Publish receipt and lock accepted issue
        if: steps.validate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 competition/submission_intake.py finalize
          --metadata "$RUNNER_TEMP/loomq-submission.json"
          --artifact-id "${{ steps.archive.outputs.artifact-id }}"
